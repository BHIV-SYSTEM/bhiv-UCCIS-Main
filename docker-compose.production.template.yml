# ============================================================
# UCCIS Platform – Production Compose Template
#
# IMG_TAG is replaced at deploy time with the 7-char Git commit SHA.
# Compiled and deployed via GitHub Actions CI/CD Pipeline.
#
# Host Port Allocations:
# - Backend:  5005 -> 5000 (Internal)
# - Frontend: 3010 -> 3000 (Internal)
# ============================================================

services:
  uccis-backend:
    image: bhiv/uccis-backend:IMG_TAG
    container_name: uccis_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5005}:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    volumes:
      - uccis_sqlite_data:/app/database/sqlite
      - uccis_logs:/app/logs
      - uccis_runtime_logs:/app/runtime_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - uccis_network

  uccis-frontend:
    image: bhiv/uccis-frontend:IMG_TAG
    container_name: uccis_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      uccis-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - uccis_network

volumes:
  uccis_sqlite_data:
    driver: local
  uccis_logs:
    driver: local
  uccis_runtime_logs:
    driver: local

networks:
  uccis_network:
    driver: bridge

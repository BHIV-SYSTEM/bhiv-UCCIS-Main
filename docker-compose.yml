# ============================================================
# UCCIS Platform – Local Development Compose Stack
#
# Host Port Allocations:
# - Backend:  5005 -> 5000 (Internal)
# - Frontend: 3010 -> 3000 (Internal)
# ============================================================

services:
  uccis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uccis_backend_dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5005}:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
    volumes:
      - uccis_sqlite_data:/app/database/sqlite
      - uccis_logs:/app/logs
      - uccis_runtime_logs:/app/runtime_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - uccis_network

  uccis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5005}
    container_name: uccis_frontend_dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      uccis-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - uccis_network

volumes:
  uccis_sqlite_data:
    driver: local
  uccis_logs:
    driver: local
  uccis_runtime_logs:
    driver: local

networks:
  uccis_network:
    driver: bridge
